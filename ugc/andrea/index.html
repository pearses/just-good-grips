<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JGG — Your Discount Code</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111111;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #2C2C2E;
      border-radius: 12px;
      padding: 18px 20px;
      width: 100%;
      max-width: 500px;
    }
    .label {
      font-size: 13px;
      color: #8E8E93;
      margin-bottom: 6px;
    }
    .code-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .code {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.03em;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      background: #FFFFFF;
      color: #111111;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .btn:active { transform: scale(0.96); }
    .btn.copied { background: #34C759; color: #fff; }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  </style>
</head>
<body>
<div class="card">
  <p class="label">Your discount code</p>
  <div class="code-row">
    <p class="code" id="code">—</p>
    <button class="btn" id="copyBtn" onclick="copyCode()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      <span id="btnText">Copy</span>
    </button>
  </div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code') || 'ANDREA10';
  document.getElementById('code').textContent = code;

  function copyCode() {
    navigator.clipboard.writeText(code).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.classList.add('copied');
      btn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span>Copied!</span>`;
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span>Copy</span>`;
      }, 2000);
    });
  }
</script>
</body>
</html>
