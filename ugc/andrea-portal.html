<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>JGG — Team Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111111;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #2C2C2E;
      border-radius: 12px;
      padding: 18px;
      width: 100%;
      max-width: 1000px;
    }
    .label {
      font-size: 13px;
      color: #8E8E93;
      margin-bottom: 12px;
    }
    .report-frame {
      position: relative;
      width: 100%;
      padding-top: 75%;
      background: #FFFFFF;
      border-radius: 8px;
      overflow: hidden;
    }
    .report-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="label">Team dashboard — sign in with your Google account to view</p>
    <div class="report-frame">
      <iframe
        src="https://datastudio.google.com/embed/reporting/92f20d53-e96c-450d-b881-f659e21459f2/page/qeY3F"
        allowfullscreen
        sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
      ></iframe>
    </div>
  </div>
</body>
</html>
