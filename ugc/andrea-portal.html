<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>JGG — Team Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #111111;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #2C2C2E;
      border-radius: 12px;
      padding: 18px;
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
    }
    .label {
      font-size: 13px;
      color: #8E8E93;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .code-card {
      background: #1C1C1E;
      border-radius: 10px;
      padding: 14px 16px;
      margin-top: 16px;
      flex-shrink: 0;
    }
    .code-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .code {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.03em;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      background: #FFFFFF;
      color: #111111;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .btn:active { transform: scale(0.96); }
    .btn.copied { background: #34C759; color: #fff; }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .report-frame {
      position: relative;
      width: 100%;
      padding-top: 75%;
      background: #FFFFFF;
      border-radius: 8px;
      overflow: hidden;
    }
    .report-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 640px) {
      html, body { overflow: hidden; }
      body { padding: 0; }
      .card {
        max-width: 100%;
        height: 100vh;
        height: 100svh;
        border-radius: 0;
        padding: 12px 12px 0;
      }
      .report-frame {
        flex: 1 1 auto;
        min-height: 0;
        padding-top: 0;
        border-radius: 8px 8px 0 0;
      }
      .code-card {
        flex-shrink: 0;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="label">Your dashboard — sign in with your Google account to view</p>
    <div class="report-frame">
      <iframe
        src="https://datastudio.google.com/embed/reporting/92f20d53-e96c-450d-b881-f659e21459f2/page/qeY3F"
        allowfullscreen
        sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
      ></iframe>
    </div>
    <div class="code-card">
      <p class="label" style="margin-bottom: 6px;">Your discount code</p>
      <div class="code-row">
        <p class="code" id="code">—</p>
        <button class="btn" id="copyBtn" onclick="copyCode()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span id="btnText">Copy</span>
        </button>
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || 'ANDREA10';
    document.getElementById('code').textContent = code;

    function copyCode() {
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span>Copied!</span>`;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span>Copy</span>`;
        }, 2000);
      });
    }
  </script>
</body>
</html>
